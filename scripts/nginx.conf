# Resolves the Connection header for proxied WebSocket upgrades: "upgrade" when
# the client asked to upgrade, and "" (close) otherwise, so ordinary requests are
# unaffected. Valid here because sites-enabled/* is included in the http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root /opt/spinshare/frontend/dist;
    index index.html;

    # Strip /api prefix and forward to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the chat WebSocket (/api/ws/chat). Without the Upgrade
        # and Connection headers nginx silently downgrades the handshake to a
        # plain HTTP request and the socket never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # An idle chat socket sends nothing for long stretches. The default
        # 60s read timeout would close it repeatedly; this sits above uvicorn's
        # 20s ping interval so the connection is kept alive by pings rather
        # than being torn down and reconnected every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
