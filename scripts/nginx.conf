# NOTE: nothing in the deploy pipeline applies this file — it syncs the frontend
# build and restarts the API, but never touches /etc/nginx. Changes here have to
# be copied to the server by hand and followed by `nginx -t && systemctl reload
# nginx`, or they simply never take effect.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root /opt/spinshare/frontend/dist;
    index index.html;

    # The chat WebSocket. Kept in its own location, matched before /api/ below
    # because nginx prefers the longer prefix, so the upgrade headers and the
    # hour-long timeouts apply to sockets only and ordinary API calls keep the
    # default 60s read timeout.
    #
    # Without the Upgrade and Connection headers nginx quietly downgrades the
    # handshake to a plain HTTP GET. uvicorn then hands it to the app as a
    # normal request, which finds only a WebSocket route at that path and
    # answers 404 — so the failure looks like a missing endpoint rather than a
    # proxy problem.
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle chat socket sends nothing for long stretches. The default 60s
        # read timeout would close it repeatedly; this sits above uvicorn's 20s
        # ping interval so the connection is held open by pings rather than
        # being torn down and reconnected every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Strip /api prefix and forward to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
